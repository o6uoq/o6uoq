name: Validate fitness CLI

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install locked tools
        run: |
          python -m pip install uv==0.12.21
          uv sync --frozen
      - name: Regression tests
        run: uv run pytest
      - name: Type checks
        run: uv run pyright
      - name: Container smoke test
        run: |
          docker build -t fitness-cli:test .
          docker run --rm --network none fitness-cli:test uv run python -c "import app.fitbit, app.strava, app.profile; import importlib.util; assert importlib.util.find_spec('pytest') is None"
      - name: Pre-commit
        run: uv run pre-commit run -a
