name: Validate fitness CLI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install locked tools
        run: |
          python -m pip install uv==0.12.22
          uv sync --frozen
      - name: Regression tests
        run: uv run pytest
      - name: Type checks
        run: uv run pyright
      - name: Container smoke test
        run: |
          docker build -t fitness-cli:test .
          docker run --rm --network none -v "${{ github.workspace }}:/app" fitness-cli:test uv run python -c "import app.fitbit, app.strava, app.profile; import importlib.util; assert importlib.util.find_spec('pytest') is None"
          docker run --rm --init --shm-size=256m --network none fitness-cli:test uv run python -c "from camoufox.sync_api import Camoufox; c = Camoufox(headless='virtual', os='linux'); b = c.__enter__(); p = b.new_page(); p.goto('about:blank'); c.__exit__(None, None, None)"
      - name: Verify Strava website on a GitHub runner
        if: github.event_name == 'workflow_dispatch'
        env:
          STRAVA_LOGIN: ${{ secrets.STRAVA_LOGIN }}
          STRAVA_PASSWORD: ${{ secrets.STRAVA_PASSWORD }}
        run: docker run --rm --init --shm-size=256m -e STRAVA_LOGIN -e STRAVA_PASSWORD fitness-cli:test uv run python -m app.strava strava-latest-workout
      - name: Pre-commit
        run: uv run pre-commit run -a
