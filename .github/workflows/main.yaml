name: GitHub Profile README Updater Workflow

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      skip_artifact:
        description: 'Skip artifact download and use GitHub Secrets directly (use when manually refreshing tokens)'
        required: false
        default: false
        type: boolean

# Token rotation must finish before another run consumes the updated artifacts.
concurrency:
  group: health-profile
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  build-and-run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Create environment file
      run: |
        cat << EOF > .env
        ### Fitbit environment variables
        FITBIT_AUTH_URI=${{ vars.FITBIT_AUTH_URI }}
        FITBIT_EXPIRES_AT=${{ vars.FITBIT_EXPIRES_AT }}
        FITBIT_REDIRECT_URI=${{ vars.FITBIT_REDIRECT_URI }}
        FITBIT_TOKEN_REQUEST_URI=${{ vars.FITBIT_TOKEN_REQUEST_URI }}
        ### Fitbit secrets
        FITBIT_ACCESS_TOKEN=${{ secrets.FITBIT_ACCESS_TOKEN }}
        FITBIT_CLIENT_ID=${{ secrets.FITBIT_CLIENT_ID }}
        FITBIT_CLIENT_SECRET=${{ secrets.FITBIT_CLIENT_SECRET }}
        FITBIT_REFRESH_TOKEN=${{ secrets.FITBIT_REFRESH_TOKEN }}
        EOF

    - name: Find latest token artifacts independently
      id: tokens
      if: inputs.skip_artifact != true
      uses: actions/github-script@v9
      with:
        script: |
          const found = new Set();
          for await (const response of github.paginate.iterator(github.rest.actions.listArtifactsForRepo, {
            owner: context.repo.owner, repo: context.repo.repo, per_page: 100
          })) {
            for (const artifact of response.data) {
              for (const service of ['fitbit']) {
                if (artifact.name === `${service}-tokens` && !artifact.expired && artifact.workflow_run?.head_branch === 'main' && !found.has(service)) {
                  core.setOutput(service, artifact.workflow_run.id);
                  found.add(service);
                }
              }
            }
            if (found.size === 1) break;
          }

    - name: Download Fitbit tokens
      id: download_fitbit
      uses: actions/download-artifact@v8
      if: steps.tokens.outputs.fitbit != ''
      continue-on-error: true
      with:
        name: fitbit-tokens
        run-id: ${{ steps.tokens.outputs.fitbit }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Report token download failures
      if: steps.download_fitbit.outcome == 'failure'
      run: echo "::warning::Token artifact download failed; falling back to repository secrets."

    - name: Update .env file with latest tokens data
      run: |
        if [ -f fitbit_tokens.json ]; then
          FITBIT_ACCESS_TOKEN=$(jq -r '.FITBIT_ACCESS_TOKEN' fitbit_tokens.json)
          FITBIT_REFRESH_TOKEN=$(jq -r '.FITBIT_REFRESH_TOKEN' fitbit_tokens.json)
          FITBIT_EXPIRES_AT=$(jq -r '.FITBIT_EXPIRES_AT' fitbit_tokens.json)

          {
            printf '%s\n' "FITBIT_ACCESS_TOKEN=$FITBIT_ACCESS_TOKEN"
            printf '%s\n' "FITBIT_REFRESH_TOKEN=$FITBIT_REFRESH_TOKEN"
            printf '%s\n' "FITBIT_EXPIRES_AT=$FITBIT_EXPIRES_AT"
          } >> .env
        else
          echo "[WARN] fitbit_tokens.json not found, skipping .env update."
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build cached Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      env:
        DOCKER_BUILD_RECORD_UPLOAD: false
      with:
        context: .
        load: true
        tags: fitness-cli
        cache-from: type=gha,scope=fitness-cli
        cache-to: type=gha,scope=fitness-cli,mode=max

    - name: Run Fitbit tokens
      id: fitbit_tokens
      run: docker run --env-file .env -v ${{ github.workspace }}:/app fitness-cli uv run python -m app.fitbit fitbit-tokens
      continue-on-error: true

    - name: Update README from successful service responses
      id: profile
      continue-on-error: true
      env:
        STRAVA_LOGIN: ${{ secrets.STRAVA_LOGIN }}
        STRAVA_PASSWORD: ${{ secrets.STRAVA_PASSWORD }}
      run: docker run --rm --init --shm-size=256m --env-file .env -e STRAVA_LOGIN -e STRAVA_PASSWORD -v ${{ github.workspace }}:/app fitness-cli uv run python -m app.profile

    - name: Commit and push changes
      run: |
        git config --global user.name 'o6uoq'
        git config --global user.email 'david@git.id.au'
        git add README.md
        if ! git diff --cached --quiet; then
          git commit -m "🔄 ci: updating README with health data"
          git push
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Report service failures
      if: always() && (steps.fitbit_tokens.outcome == 'failure' || steps.profile.outcome == 'failure')
      run: |
        echo "::error::Health update failed. Existing data was preserved for unavailable services."
        {
          echo "## Health update needs attention"
          echo "- Fitbit refresh: ${{ steps.fitbit_tokens.outcome }}"
          echo "- Profile fetch: ${{ steps.profile.outcome }}"
          echo "See app/README.md for diagnosis and recovery."
        } >> "$GITHUB_STEP_SUMMARY"
        exit 1

    - name: Upload Fitbit Tokens to GitHub Artifacts
      if: always() && steps.fitbit_tokens.outcome == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: fitbit-tokens
        path: fitbit_tokens.json
        if-no-files-found: warn
