name: Update Health Profile

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

# Serialise profile commits.
concurrency:
  group: health-profile
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Build Docker image
      run: docker build -t fitness-cli .

    - name: Update profile from available services
      id: profile
      continue-on-error: true
      env:
        GOOGLE_HEALTH_CLIENT_ID: ${{ secrets.GOOGLE_HEALTH_CLIENT_ID }}
        GOOGLE_HEALTH_CLIENT_SECRET: ${{ secrets.GOOGLE_HEALTH_CLIENT_SECRET }}
        GOOGLE_HEALTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_HEALTH_REFRESH_TOKEN }}
        STRAVA_LOGIN: ${{ secrets.STRAVA_LOGIN }}
        STRAVA_PASSWORD: ${{ secrets.STRAVA_PASSWORD }}
      run: >-
        docker run --rm --init --shm-size=256m
        -e GOOGLE_HEALTH_CLIENT_ID -e GOOGLE_HEALTH_CLIENT_SECRET -e GOOGLE_HEALTH_REFRESH_TOKEN
        -e STRAVA_LOGIN -e STRAVA_PASSWORD
        -v ${{ github.workspace }}:/app fitness-cli uv run python -m app.profile

    - name: Commit and push changes
      run: |
        git config --global user.name 'o6uoq'
        git config --global user.email 'david@git.id.au'
        git add README.md
        if ! git diff --cached --quiet; then
          git commit -m "🔄 ci: updating README with health data"
          git push
        fi

    - name: Report service failures
      if: always() && steps.profile.outcome == 'failure'
      run: |
        echo "::error::Health update incomplete; failed services retain previous data."
        {
          echo "## Health update"
          echo "- Profile update: ${{ steps.profile.outcome }}"
          echo 'Check the failed service log. Google Health access needs Google OAuth consent; legacy Fitbit reauthorisation cannot repair it.'
          echo 'See app/README.md for setup and recovery.'
        } >> "$GITHUB_STEP_SUMMARY"
        exit 1
